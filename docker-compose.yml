version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_VERSION=v1
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    # Host port 6380, not 6379 — 6379 is commonly already taken by another
    # project's Redis, exactly as with Postgres on 5433 below.
    ports:
      - '6380:6379'
    # Real-time events are re-derivable from the chain and every key is
    # short-TTL, so persistence buys nothing here; disabling it removes the
    # fork-and-write pause that would otherwise stall the event bus.
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    # Published to the host so `node server.js` and `npm run db:migrate`
    # (both run outside Docker) can reach it. Host port 5433, not 5432 —
    # 5432 is commonly already taken by another project's Postgres.
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
