<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="sentinel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Container -->
  <rect width="32" height="32" rx="8" fill="#030712" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="url(#sentinel-grad)" stroke-width="1" stroke-opacity="0.3" />
  
  <!-- Outer Hexagonal / Shield Radar Ring -->
  <path d="M16 4 L26 9.5 L26 19.5 L16 28 L6 19.5 L6 9.5 Z" fill="none" stroke="url(#sentinel-grad)" stroke-width="1.6" filter="url(#glow)" stroke-linejoin="round" />
  
  <!-- Inner Crosshairs / Sentinel Radar Reticle -->
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 1.5" />
  <circle cx="16" cy="16" r="2" fill="#38bdf8" />
  
  <!-- Radar sweep line -->
  <line x1="16" y1="16" x2="22" y2="11" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" />
</svg>
